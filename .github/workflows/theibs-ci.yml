name: THEIBS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theibs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codigo-fonte
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Snapshot tracked source
        run: |
          mkdir -p ../validation-output
          git rev-parse HEAD > ../validation-output/tested-commit.txt
          git -C "$GITHUB_WORKSPACE" archive --format=zip --output="$GITHUB_WORKSPACE/validation-output/theibs-tested-source.zip" HEAD
      - name: Syntax checks
        run: |
          find src public scripts test -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
          node --check server.js
      - name: Node test suite
        run: |
          set -o pipefail
          node --test "test/*.test.cjs" 2>&1 | tee ../validation-output/node-tests.txt
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/theibs-browser" --ignore-scripts --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/theibs-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/theibs-browser/node_modules" >> "$GITHUB_ENV"
          echo "THEIBS_CHROMIUM_PATH=$(node -e "console.log(require('$RUNNER_TEMP/theibs-browser/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Controlled voice matrix (no audio or provider calls)
        run: |
          set -o pipefail
          node scripts/qa-voice-quality.cjs --out=../validation-output/controlled-voice 2>&1 | tee ../validation-output/controlled-voice.log
      - name: Statistics and voice destination integration
        run: |
          set -o pipefail
          node scripts/qa-statistics-voice-focus.cjs --out=../validation-output/statistics-browser 2>&1 | tee ../validation-output/statistics-browser.log
      - name: Keyboard rendering proxy, serial execution
        run: |
          set -o pipefail
          node scripts/benchmark-keyboard-ui.cjs --out=../validation-output/keyboard --label=rc1 --events=400 --delay=20 2>&1 | tee ../validation-output/keyboard.log
      - name: Check tracked source remained unchanged
        run: git diff --exit-code -- .
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theibs-source-and-tests-${{ github.run_id }}
          path: validation-output/
          retention-days: 7
          if-no-files-found: error
